<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamma narration player</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0a0b10;
      color: #f8fafc;
      font: 600 14px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .player {
      width: min(92vw, 720px);
      padding: 14px 16px;
      border: 1px solid rgba(111, 224, 255, .35);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(34, 211, 238, .13), rgba(139, 92, 246, .15));
      box-shadow: 0 18px 60px rgba(0, 0, 0, .38);
    }
    .label { margin: 0 0 10px; letter-spacing: .08em; text-transform: uppercase; color: #a5f3fc; }
    audio { display: block; width: 100%; height: 42px; }
  </style>
</head>
<body>
  <main class="player">
    <p class="label" id="label">Narration</p>
    <audio id="audio" controls preload="auto"></audio>
  </main>
  <script>
    const value = new URLSearchParams(location.search).get('card') || '01';
    const card = String(Math.max(1, Math.min(25, Number(value) || 1))).padStart(2, '0');
    document.getElementById('label').textContent = `Narration · Card ${card}`;
    document.getElementById('audio').src = `audio/card-${card}.mp3`;
  </script>
</body>
</html>
